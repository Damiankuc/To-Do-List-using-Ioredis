services:
  redis:
    image: redis:alpine
    container_name: todo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  frontend_app1:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: todo_frontend_app1
    ports:
      - "3001:3001"
    environment:
      - APP_INSTANCE=app1
      - PORT=3001
      - NGINX_ENVSUBST_FILTER=$$APP_INSTANCE $$PORT
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend_app2:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: todo_frontend_app2
    ports:
      - "3002:3002"
    environment:
      - APP_INSTANCE=app2
      - PORT=3002
      - NGINX_ENVSUBST_FILTER=$$APP_INSTANCE $$PORT
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
